name: release-macos-unsigned

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build Tauri app (unsigned)
        working-directory: desktop
        run: bun run tauri build

      - name: List bundle outputs
        run: |
          ls -la desktop/src-tauri/target/release/bundle || true
          ls -la desktop/src-tauri/target/release/bundle/macos || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-bundle
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/macos/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
