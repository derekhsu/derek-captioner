name: release-desktop-unsigned

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build Tauri app (unsigned)
        working-directory: desktop
        run: bun run tauri build

      - name: Verify macOS app bundle
        run: |
          codesign -dv --verbose=4 desktop/src-tauri/target/release/bundle/macos/Captioner.app
          codesign --verify --deep --strict --verbose=4 desktop/src-tauri/target/release/bundle/macos/Captioner.app
          spctl -a -t exec -vv desktop/src-tauri/target/release/bundle/macos/Captioner.app || true

      - name: List bundle outputs
        run: |
          ls -la desktop/src-tauri/target/release/bundle || true
          ls -la desktop/src-tauri/target/release/bundle/macos || true
          ls -la desktop/src-tauri/target/release/bundle/dmg || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-bundle
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build Tauri app (unsigned)
        working-directory: desktop
        run: bun run tauri build

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path desktop/src-tauri/target/release/bundle -Recurse | Select-Object FullName

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-bundle
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-unsigned-bundle
          path: release-artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned-bundle
          path: release-artifacts/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/macos/**/*.dmg
            release-artifacts/windows/**/*.exe
            release-artifacts/windows/**/*.msi
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
